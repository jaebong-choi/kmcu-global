<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지원서 확인 · 계명문화대학교 국제처</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="wrap"><a href="index.html" style="text-decoration:none"><b>계명문화대학교 국제처</b></a><span>지원서 확인</span></div></header>

<main class="wrap">
  <h1 style="margin-top:28px">내 지원서 확인</h1>
  <p class="lead">접수할 때 받은 접수번호와 직접 정한 비밀번호를 입력하세요.</p>

  <form class="form" id="f">
    <div class="row">
      <label>접수번호<input id="no" required placeholder="2027-0001" autocomplete="off"></label>
      <label>비밀번호<input id="pw" type="password" required autocomplete="current-password"></label>
    </div>
    <button class="btn" id="go">확인</button>
    <p class="msg" id="err"></p>
  </form>

  <section id="result" hidden>
    <div class="done" style="margin-top:0"><small>진행 상태</small><br><strong id="status"></strong></div>
    <table class="crit" id="rows"></table>
  </section>
</main>

<footer><div class="wrap" id="contact"></div></footer>

<script src="data.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const c = DATA.contact;
  $('contact').textContent = '문의 ' + [c.team, c.phone, c.email, c.place].filter(Boolean).join(' · ');

  $('f').onsubmit = async e => {
    e.preventDefault();
    $('err').textContent = '';
    $('result').hidden = true;
    if (!DATA.apiUrl) return $('err').textContent = '온라인 조회를 준비하고 있습니다.';
    $('go').disabled = true;
    try {
      const r = await fetch(DATA.apiUrl, { method: 'POST', body: JSON.stringify({ action: 'check', no: $('no').value.trim(), password: $('pw').value }) }).then(r => r.json());
      if (!r.ok) throw new Error(r.error);
      $('status').textContent = r.status;
      $('rows').innerHTML = Object.entries(r.data).filter(([, v]) => v !== '')
        .map(([k, v]) => `<tr><td>${esc(k)}</td><td style="white-space:pre-wrap;text-align:left;color:var(--ink);font-weight:400">${esc(v)}</td></tr>`).join('');
      $('result').hidden = false;
    } catch (err) {
      $('err').textContent = err.message || '조회하지 못했습니다. 잠시 후 다시 시도해 주세요.';
    }
    $('go').disabled = false;
  };
</script>
</body>
</html>
