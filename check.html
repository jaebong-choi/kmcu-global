<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지원서 확인 | 계명문화대학교 국제처</title>
<script>
  var t; try { t = localStorage.getItem("theme"); } catch (e) {}
  document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<header class="site-header">
  <div class="inner">
    <a class="logo" href="https://www.kmcu.ac.kr/" target="_blank" rel="noopener"><img src="logo.png" alt="계명문화대학교" width="229" height="47"></a>
    <a class="site-name" href="index.html">글로벌 현장학습</a>
    <nav class="util">
      <a class="pill" href="index.html">모집 안내</a>
      <button class="pill" type="button" data-act="theme">다크 모드</button>
    </nav>
  </div>
</header>

<main class="inner narrow">
  <div class="page-head">
    <h1>내 지원서 확인</h1>
    <p>접수할 때 받은 접수번호와 직접 정한 비밀번호를 입력하세요.</p>
    <div class="ask" id="ask"></div>
  </div>

  <form class="form" id="f">
    <fieldset>
      <div class="row">
        <label>접수번호<input id="no" required placeholder="2027-0001" autocomplete="off"></label>
        <label>비밀번호<input id="pw" type="password" required autocomplete="current-password"></label>
      </div>
      <button class="btn" id="go" style="margin-bottom:14px">확인</button>
      <p class="msg" id="err" style="margin:-4px 0 14px"></p>
    </fieldset>
  </form>

  <section class="card result" id="result" hidden>
    <div class="result-status"><span class="muted">진행 상태</span><strong id="status"></strong></div>
    <table class="info" id="rows"></table>
    <p class="note">내용을 고쳐야 하면 국제처로 연락해 주세요.</p>
  </section>
</main>

<footer class="site-footer"><div class="inner" id="contact"></div></footer>

<script src="data.js?v=3"></script>
<script src="common.js?v=3"></script>
<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  $('f').onsubmit = async e => {
    e.preventDefault();
    $('err').textContent = '';
    $('result').hidden = true;
    if (!DATA.apiUrl) return $('err').textContent = '온라인 조회를 준비하고 있습니다.';
    $('go').disabled = true;
    try {
      const r = await fetch(DATA.apiUrl, { method: 'POST', body: JSON.stringify({ action: 'check', no: $('no').value.trim(), password: $('pw').value }) }).then(r => r.json());
      if (!r.ok) throw new Error(r.error);
      $('status').textContent = r.status;
      $('rows').innerHTML = Object.entries(r.data).filter(([, v]) => v !== '')
        .map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('');
      $('result').hidden = false;
    } catch (err) {
      $('err').textContent = err.message || '조회하지 못했습니다. 잠시 후 다시 시도해 주세요.';
    }
    $('go').disabled = false;
  };
</script>
</body>
</html>
